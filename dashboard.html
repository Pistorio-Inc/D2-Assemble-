<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D2 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wood: #1c1512;
    --wood-light: #2a2019;
    --brass: #c8983a;
    --brass-bright: #e0b355;
    --cream: #ede6d6;
    --cream-dim: #b8ac97;
    --call: #c1442e;
    --call-bright: #d95a3f;
    --success: #6b8e5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--wood);
    color: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
  }
  header {
    padding: 20px 20px 16px;
    text-align: center;
    border-bottom: 1px solid rgba(200,152,58,0.2);
  }
  .eyebrow {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--cream-dim);
  }
  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    margin: 4px 0 0;
    color: var(--brass-bright);
  }
  .status {
    font-size: 13px;
    color: var(--cream-dim);
    margin-top: 4px;
  }
  .status .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    margin-right: 6px;
  }

  .enable-sound {
    margin: 20px auto;
    display: block;
    padding: 14px 28px;
    border-radius: 10px;
    border: 1px solid var(--brass);
    background: transparent;
    color: var(--brass-bright);
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .enable-sound.done { display: none; }

  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .empty {
    text-align: center;
    color: var(--cream-dim);
    margin-top: 80px;
    font-size: 15px;
  }
  .empty .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }

  .call-card {
    background: var(--wood-light);
    border: 1px solid rgba(200,152,58,0.25);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    animation: pop 0.25s ease;
  }
  .call-card.new {
    border-color: var(--call);
    box-shadow: 0 0 0 3px rgba(193,68,46,0.25);
    animation: pulse 1s ease infinite;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(193,68,46,0.25); }
    50% { box-shadow: 0 0 0 6px rgba(193,68,46,0.4); }
  }

  .call-info { flex: 1; min-width: 0; }
  .call-location {
    font-family: 'Oswald', sans-serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 2px;
  }
  .call-time { font-size: 13px; color: var(--cream-dim); }

  .resolve-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--success);
    color: var(--wood);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .resolve-btn:active { opacity: 0.8; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Towne Tavern &amp; Tap</div>
  <h1>D2 Dashboard</h1>
  <div class="status"><span class="dot"></span><span id="statusText">Connecting...</span></div>
</header>

<button class="enable-sound" id="enableSoundBtn">🔔 Enable Sound Alerts</button>

<main>
  <div id="list"></div>
  <div class="empty" id="emptyState">
    <div class="icon">🍺</div>
    All quiet. No one's calling for D2.
  </div>
</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";

const firebaseConfig = {
  apiKey: "AIzaSyDplUbmXozbk_Xylv727cIE_LwViBsCoKg",
  authDomain: "d2-assemble.firebaseapp.com",
  projectId: "d2-assemble",
  storageBucket: "d2-assemble.firebasestorage.app",
  messagingSenderId: "458663868012",
  appId: "1:458663868012:web:a7058f429fe59ac65e8a49",
  measurementId: "G-TX2VWMF32V"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const list = document.getElementById('list');
  const emptyState = document.getElementById('emptyState');
  const statusText = document.getElementById('statusText');
  const enableSoundBtn = document.getElementById('enableSoundBtn');

  let soundEnabled = false;
  let audioCtx = null;
  let firstLoad = true;
  let knownIds = new Set();

  // Simple beep using Web Audio API (no external file needed)
  function playChime() {
    if (!soundEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    [880, 1320].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, now + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.3, now + i * 0.15 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i * 0.15);
      osc.stop(now + i * 0.15 + 0.4);
    });
  }

  enableSoundBtn.addEventListener('click', () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    playChime();
    soundEnabled = true;
    enableSoundBtn.classList.add('done');
    if (Notification && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  });

  function timeAgo(date) {
    if (!date) return 'just now';
    const secs = Math.floor((Date.now() - date.getTime()) / 1000);
    if (secs < 60) return 'just now';
    const mins = Math.floor(secs / 60);
    if (mins < 60) return mins + ' min ago';
    const hrs = Math.floor(mins / 60);
    return hrs + ' hr ago';
  }

  function render(docs) {
    list.innerHTML = '';
    emptyState.style.display = docs.length === 0 ? 'block' : 'none';

    docs.forEach(doc => {
      const data = doc.data();
      const createdAt = data.createdAt ? data.createdAt.toDate() : null;
      const isNew = !knownIds.has(doc.id) && !firstLoad;

      const card = document.createElement('div');
      card.className = 'call-card' + (isNew ? ' new' : '');
      card.innerHTML = `
        <div class="call-info">
          <div class="call-location">${escapeHtml(data.location)}</div>
          <div class="call-time">${timeAgo(createdAt)}</div>
        </div>
        <button class="resolve-btn" data-id="${doc.id}">On my way</button>
      `;
      list.appendChild(card);
    });

    list.querySelectorAll('.resolve-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = '...';
        await db.collection('calls').doc(btn.dataset.id).update({
          resolved: true,
          resolvedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  db.collection('calls')
    .where('resolved', '==', false)
    .orderBy('createdAt', 'asc')
    .onSnapshot(snapshot => {
      statusText.textContent = 'Live';
      const docs = snapshot.docs;

      const hasNew = !firstLoad && docs.some(d => !knownIds.has(d.id));
      if (hasNew) playChime();

      if (hasNew && Notification && Notification.permission === 'granted') {
        const newest = docs[docs.length - 1].data();
        new Notification('D2 — someone needs you', { body: newest.location });
      }

      render(docs);
      knownIds = new Set(docs.map(d => d.id));
      firstLoad = false;
    }, err => {
      statusText.textContent = 'Connection error';
      console.error(err);
    });

  // Refresh "time ago" labels periodically without a full re-render flash
  setInterval(() => {
    db.collection('calls').where('resolved', '==', false).orderBy('createdAt', 'asc').get()
      .then(snap => render(snap.docs));
  }, 30000);
</script>
</body>
</html>
