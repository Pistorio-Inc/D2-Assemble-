<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Call D2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wood: #1c1512;
    --wood-light: #2a2019;
    --brass: #c8983a;
    --brass-bright: #e0b355;
    --cream: #ede6d6;
    --cream-dim: #b8ac97;
    --call: #c1442e;
    --call-bright: #d95a3f;
    --success: #6b8e5a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--wood);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(200,152,58,0.08), transparent 60%);
    color: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }

  .screen {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .eyebrow {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--cream-dim);
    margin-bottom: 8px;
  }

  .venue {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--brass-bright);
    margin-bottom: 48px;
  }

  /* Tap-handle button */
  .tap-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .tap-shaft {
    width: 14px;
    height: 40px;
    background: linear-gradient(180deg, #8a6a28, var(--brass));
    border-radius: 4px 4px 0 0;
    box-shadow: inset -3px 0 4px rgba(0,0,0,0.3);
  }

  #callBtn {
    width: min(62vw, 260px);
    height: min(62vw, 260px);
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, var(--call-bright), var(--call) 70%);
    box-shadow:
      0 10px 0 #7a2718,
      0 14px 24px rgba(0,0,0,0.5),
      inset 0 4px 12px rgba(255,255,255,0.15);
    color: var(--cream);
    font-family: 'Oswald', sans-serif;
    font-size: clamp(48px, 16vw, 72px);
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  #callBtn:active {
    transform: translateY(8px);
    box-shadow:
      0 2px 0 #7a2718,
      0 4px 10px rgba(0,0,0,0.5),
      inset 0 4px 12px rgba(255,255,255,0.15);
  }

  .hint {
    margin-top: 28px;
    color: var(--cream-dim);
    font-size: 15px;
    max-width: 280px;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .overlay.show { display: flex; }

  .card {
    background: var(--wood-light);
    border: 1px solid rgba(200,152,58,0.3);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .card h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--brass-bright);
  }

  .card p {
    color: var(--cream-dim);
    font-size: 14px;
    margin: 0 0 20px;
  }

  #locationInput {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    border-radius: 10px;
    border: 1px solid rgba(237,230,214,0.2);
    background: var(--wood);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    margin-bottom: 14px;
  }
  #locationInput::placeholder { color: var(--cream-dim); opacity: 0.6; }
  #locationInput:focus { outline: 2px solid var(--brass); border-color: var(--brass); }

  .quick-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .tag {
    padding: 8px 14px;
    border-radius: 20px;
    background: rgba(200,152,58,0.12);
    border: 1px solid rgba(200,152,58,0.35);
    color: var(--brass-bright);
    font-size: 13px;
    cursor: pointer;
  }
  .tag:active { background: rgba(200,152,58,0.25); }

  .btn-row { display: flex; gap: 10px; }

  button.action {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .send { background: var(--call); color: var(--cream); }
  .send:disabled { opacity: 0.4; }
  .cancel { background: transparent; color: var(--cream-dim); border: 1px solid rgba(237,230,214,0.2) !important; }

  /* Confirmation state */
  .confirm {
    position: fixed;
    inset: 0;
    background: var(--wood);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 20;
  }
  .confirm.show { display: flex; }
  .check {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 20px;
  }
  .confirm h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    margin: 0 0 6px;
  }
  .confirm p { color: var(--cream-dim); margin: 0; }
</style>
</head>
<body>

<div class="screen">
  <div class="eyebrow">Towne Tavern &amp; Tap</div>
  <div class="venue">Call for Manager</div>

  <div class="tap-wrap">
    <div class="tap-shaft"></div>
    <button id="callBtn">D2</button>
  </div>

  <div class="hint">Tap the button, tell D2 where you are, and he'll head right over.</div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2>Where are you?</h2>
    <p>Let D2 know where to find you</p>
    <input id="locationInput" type="text" placeholder="e.g. Bar, Patio, Table 12..." maxlength="60" autocomplete="off">
    <div class="quick-tags">
      <div class="tag" data-loc="Bar">Bar</div>
      <div class="tag" data-loc="Kitchen">Kitchen</div>
      <div class="tag" data-loc="Patio">Patio</div>
      <div class="tag" data-loc="Front">Front</div>
      <div class="tag" data-loc="Dining Room">Dining Room</div>
    </div>
    <div class="btn-row">
      <button class="action cancel" id="cancelBtn">Cancel</button>
      <button class="action send" id="sendBtn" disabled>Send</button>
    </div>
  </div>
</div>

<div class="confirm" id="confirm">
  <div class="check">✓</div>
  <h2>Sent to D2</h2>
  <p id="confirmLoc"></p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";

const firebaseConfig = {
  apiKey: "AIzaSyDplUbmXozbk_Xylv727cIE_LwViBsCoKg",
  authDomain: "d2-assemble.firebaseapp.com",
  projectId: "d2-assemble",
  storageBucket: "d2-assemble.firebasestorage.app",
  messagingSenderId: "458663868012",
  appId: "1:458663868012:web:a7058f429fe59ac65e8a49",
  measurementId: "G-TX2VWMF32V"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const callBtn = document.getElementById('callBtn');
  const overlay = document.getElementById('overlay');
  const input = document.getElementById('locationInput');
  const sendBtn = document.getElementById('sendBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const confirmScreen = document.getElementById('confirm');
  const confirmLoc = document.getElementById('confirmLoc');

  callBtn.addEventListener('click', () => {
    overlay.classList.add('show');
    input.value = '';
    sendBtn.disabled = true;
    setTimeout(() => input.focus(), 150);
  });

  cancelBtn.addEventListener('click', () => {
    overlay.classList.remove('show');
  });

  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim().length === 0;
  });

  document.querySelectorAll('.tag').forEach(tag => {
    tag.addEventListener('click', () => {
      input.value = tag.dataset.loc;
      sendBtn.disabled = false;
      input.focus();
    });
  });

  sendBtn.addEventListener('click', async () => {
    const location = input.value.trim();
    if (!location) return;
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending...';
    try {
      await db.collection('calls').add({
        location: location,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        resolved: false
      });
      overlay.classList.remove('show');
      confirmLoc.textContent = location;
      confirmScreen.classList.add('show');
      setTimeout(() => {
        confirmScreen.classList.remove('show');
        sendBtn.textContent = 'Send';
      }, 2200);
    } catch (err) {
      alert('Could not send. Check your connection and try again.');
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
    }
  });
</script>
</body>
</html>
